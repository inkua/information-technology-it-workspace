<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Control Inkua</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card h2 {
            margin-top: 0;
            color: #0056b3;
            font-size: 1.25rem;
        }
        .card p {
            color: #555;
            font-size: 0.95rem;
            flex-grow: 1;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #777;
        }
        .stats span {
            display: flex;
            align-items: center;
        }
        .stats i {
            margin-right: 5px;
        }
        .links {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        .links a {
            text-decoration: none;
            color: #fff;
            background-color: #0056b3;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            text-align: center;
            flex-grow: 1;
        }
        .links a:hover {
            background-color: #004494;
        }
        .message {
            text-align: center;
            font-size: 1.1rem;
            color: #555;
            margin-top: 20px;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>

    <h1>Tablero de Control Inkua</h1>
    <div id="message-container" class="message">
        Cargando repositorios...
    </div>
    <div id="dashboard" class="dashboard">
        <!-- Cards will be injected here by JavaScript -->
    </div>

    <script>
        const dashboard = document.getElementById('dashboard');
        const messageContainer = document.getElementById('message-container');

        async function fetchAllRepos(orgName) {
            let allRepos = [];
            let page = 1;
            let hasMore = true;

            while (hasMore) {
                const response = await fetch(`https://api.github.com/users/${orgName}/repos?per_page=100&page=${page}`);

                if (!response.ok) {
                    throw new Error(`Error de red: ${response.status} ${response.statusText}`);
                }

                const repos = await response.json();

                if (repos.length > 0) {
                    allRepos = allRepos.concat(repos);
                    page++;
                } else {
                    hasMore = false;
                }
            }
            return allRepos;
        }

        async function init() {
            try {
                const repos = await fetchAllRepos('inkua');

                messageContainer.style.display = 'none';

                if (repos.length === 0) {
                    messageContainer.textContent = 'No se encontraron repositorios.';
                    messageContainer.style.display = 'block';
                    return;
                }

                displayRepos(repos);
            } catch (error) {
                console.error('Error fetching repositories:', error);
                messageContainer.textContent = 'Error al cargar los repositorios. Por favor, intenta de nuevo más tarde.';
                messageContainer.classList.add('error');
            }
        }

        function displayRepos(repos) {
            dashboard.innerHTML = '';
            repos.forEach(repo => {
                const card = document.createElement('div');
                card.className = 'card';

                const contentTop = document.createElement('div');

                const title = document.createElement('h2');
                title.textContent = repo.name;

                const desc = document.createElement('p');
                desc.textContent = repo.description || 'Sin descripción';

                contentTop.appendChild(title);
                contentTop.appendChild(desc);

                const contentBottom = document.createElement('div');

                const statsDiv = document.createElement('div');
                statsDiv.className = 'stats';

                const starsSpan = document.createElement('span');
                starsSpan.textContent = `⭐ ${repo.stargazers_count}`;

                const forksSpan = document.createElement('span');
                forksSpan.textContent = `🍴 ${repo.forks_count}`;

                const issuesSpan = document.createElement('span');
                issuesSpan.textContent = `🐛 Issues: ${repo.open_issues_count}`;

                statsDiv.appendChild(starsSpan);
                statsDiv.appendChild(forksSpan);
                statsDiv.appendChild(issuesSpan);

                const linksDiv = document.createElement('div');
                linksDiv.className = 'links';

                const githubLink = document.createElement('a');
                githubLink.href = repo.html_url;
                githubLink.target = '_blank';
                githubLink.rel = 'noopener noreferrer';
                githubLink.textContent = 'Ver en GitHub';
                linksDiv.appendChild(githubLink);

                if (repo.homepage) {
                    const siteLink = document.createElement('a');
                    siteLink.href = repo.homepage;
                    siteLink.target = '_blank';
                    siteLink.rel = 'noopener noreferrer';
                    siteLink.textContent = 'Sitio Web';
                    linksDiv.appendChild(siteLink);
                }

                contentBottom.appendChild(statsDiv);
                contentBottom.appendChild(linksDiv);

                card.appendChild(contentTop);
                card.appendChild(contentBottom);

                dashboard.appendChild(card);
            });
        }

        // Fetch data on load
        init();
    </script>

</body>
</html>
